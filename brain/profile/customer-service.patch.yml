# DH闲不下来客服大脑 overlay。Go 服务是业务真相和外部动作的唯一所有者。

- id: agent-spine
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js >-
      process.env.DH_BRAIN_PERSONA ??
      'You are the DH Xianyu customer-service brain. Use only approved business tools for current facts. Never invent product, order, inventory, or price data. For every request, call submit_reply_draft exactly once. Do not return a final answer without that tool call.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: !!js process.env.DEEPSEEK_BASE_URL
    reasoningEffort: !!js process.env.DH_BRAIN_REASONING_EFFORT ?? 'high'
    streamIdleTimeoutMs: !!js Number(process.env.DH_BRAIN_STREAM_IDLE_TIMEOUT_MS ?? 30000)

- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: str-replace-editor
  disabled: true
- id: sandbox
  disabled: true
- id: sandbox-policy
  disabled: true
- id: subprocess
  disabled: true
- id: pty
  disabled: true
- id: terminal-bash
  disabled: true
- id: terminal-pwsh
  disabled: true
- id: fs-local
  disabled: true

- insert:
    - id: dh-result-tool
      name: ../runtime/result-tool.mjs

    - id: dh-business-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: dh-xianyu
        transport: streamable-http
        url: !!js process.env.DH_BRAIN_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.DH_BRAIN_MCP_TOKEN}`'
        toolCallTimeoutMs: 15000
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10

    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers: !!js JSON.parse(process.env.DH_BRAIN_PI_PROVIDERS ?? '{}')
