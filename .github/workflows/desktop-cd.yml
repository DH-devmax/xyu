name: 构建桌面端安装包

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      app_version:
        description: 正式发布版本号（不含 v）
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: 准备发布版本
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      build_version: ${{ steps.version.outputs.build_version }}
      build_time: ${{ steps.version.outputs.build_time }}
    steps:
      - name: 解析并校验版本号
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${{ inputs.app_version }}" ]; then
            app_version="${{ inputs.app_version }}"
            build_version="$app_version"
          else
            app_version="0.0.${GITHUB_RUN_NUMBER}"
            build_version="${GITHUB_REF_NAME}-${GITHUB_SHA::12}"
          fi
          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "安装包版本必须符合 1.2.3 格式：$app_version" >&2
            exit 1
          fi
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux 安装包 (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
      BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            playwright_platform: ubuntu24.04-x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            playwright_platform: ubuntu24.04-arm64
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建嵌入式前端
        run: npm ci --prefix frontend && npm run build --prefix frontend

      - name: 编译 Linux 二进制
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          package_dir="dist/dh-xianyu-agentpanel-linux-${GOARCH}"
          mkdir -p "$package_dir"
          version_ldflags="-s -w -X github.com/DH-devmax/xyu/internal/version.Version=$BUILD_VERSION -X github.com/DH-devmax/xyu/internal/version.Commit=$GITHUB_SHA -X github.com/DH-devmax/xyu/internal/version.BuildTime=$BUILD_TIME"
          go build -trimpath -ldflags="$version_ldflags" -o "$package_dir/xianyu-server" ./cmd/server
          go build -trimpath -ldflags='-s -w' -o "$package_dir/browser-install" ./cmd/browser-install

      - name: 验证 Linux 品牌数据迁移与回滚
        env:
          PRODUCT_ARCH: ${{ matrix.arch }}
        run: |
          set -Eeuo pipefail
          MIGRATION_VALIDATOR="$PWD/dist/dh-xianyu-agentpanel-linux-${PRODUCT_ARCH}/xianyu-server" \
            bash scripts/migrate-product-data.test.sh

      - name: 构建 Linux Harness runtime
        working-directory: brain/vendor/deepseek-harness
        env:
          HARNESS_TARGET: node24-linux-${{ matrix.arch == 'amd64' && 'x64' || 'arm64' }}
        run: |
          set -Eeuo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile
          CI=true corepack pnpm run build
          CI=true corepack pnpm exec tsx scripts/build-exe-for-python-sdk.ts --targets="$HARNESS_TARGET" --skip-build

      - name: 组装并检查 Linux Brain runtime
        env:
          PRODUCT_ARCH: ${{ matrix.arch }}
        run: |
          set -Eeuo pipefail
          package_dir="dist/dh-xianyu-agentpanel-linux-${PRODUCT_ARCH}"
          node_binary="$(node -p 'process.execPath')"
          node scripts/build-brain-runtime.mjs \
            --output "$package_dir/brain" --platform linux --arch "$PRODUCT_ARCH" --mode native \
            --node-binary "$node_binary"
          node scripts/check-brain-runtime-package.mjs --root "$package_dir/brain" --probe

      - name: 恢复 Linux Chromium runtime 缓存
        id: cache-linux-playwright
        uses: actions/cache/restore@v5
        with:
          path: dist/dh-xianyu-agentpanel-linux-${{ matrix.arch }}/playwright-runtime
          key: dh-xianyu-agentpanel-playwright-runtime-v6-linux-${{ matrix.arch }}-${{ matrix.playwright_platform }}-${{ hashFiles('go.mod', 'go.sum', 'cmd/browser-install/**') }}

      - name: 在原生架构 runner 预下载 Linux Chromium runtime
        if: steps.cache-linux-playwright.outputs.cache-hit != 'true'
        env:
          GOARCH: ${{ matrix.arch }}
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ${{ matrix.playwright_platform }}
        run: |
          set -Eeuo pipefail
          case "$(uname -m)" in
            x86_64) runner_arch=amd64 ;;
            aarch64|arm64) runner_arch=arm64 ;;
            *) echo "不支持的 runner 架构：$(uname -m)" >&2; exit 1 ;;
          esac
          if [ "$runner_arch" != "$GOARCH" ]; then
            echo "runner 架构 $runner_arch 与目标架构 $GOARCH 不一致，拒绝使用模拟器构建。" >&2
            exit 1
          fi
          package_dir="dist/dh-xianyu-agentpanel-linux-${GOARCH}"
          runtime_dir="$package_dir/playwright-runtime/$GOARCH"
          mkdir -p "$runtime_dir/playwright-driver" "$runtime_dir/playwright-browsers"
          "$package_dir/browser-install" \
            -driver-dir "$PWD/$runtime_dir/playwright-driver" \
            -browser-dir "$PWD/$runtime_dir/playwright-browsers"

      - name: 校验 Linux Chromium runtime 架构
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          set -Eeuo pipefail
          runtime_dir="dist/dh-xianyu-agentpanel-linux-${GOARCH}/playwright-runtime/${GOARCH}"
          node_path="$runtime_dir/playwright-driver/node"
          test -x "$node_path"
          "$node_path" --version
          node_type="$(file -b "$node_path")"
          case "$GOARCH:$node_type" in
            amd64:*x86-64*) ;;
            arm64:*aarch64*|arm64:*ARM64*) ;;
            *) echo "Playwright driver 架构错误：$node_type" >&2; exit 1 ;;
          esac
          chromium_path="$(find "$runtime_dir/playwright-browsers" -type f \
            \( -name chrome -o -name headless_shell -o -name chrome-headless-shell \) -perm -111 -print -quit)"
          test -n "$chromium_path"
          chromium_revision="$(RUNTIME_SPEC="$PWD/$runtime_dir/playwright-driver/package/browsers.json" node -e 'const b=require(process.env.RUNTIME_SPEC).browsers; console.log(b.find(x=>x.name==="chromium").revision)')"
          headless_revision="$(RUNTIME_SPEC="$PWD/$runtime_dir/playwright-driver/package/browsers.json" node -e 'const b=require(process.env.RUNTIME_SPEC).browsers; console.log(b.find(x=>x.name==="chromium-headless-shell").revision)')"
          test -d "$runtime_dir/playwright-browsers/chromium-$chromium_revision"
          test -d "$runtime_dir/playwright-browsers/chromium_headless_shell-$headless_revision"
          chromium_type="$(file -b "$chromium_path")"
          case "$GOARCH:$chromium_type" in
            amd64:*x86-64*) ;;
            arm64:*aarch64*|arm64:*ARM64*) ;;
            *) echo "Chromium 架构错误：$chromium_type" >&2; exit 1 ;;
          esac

      - name: 保存 Linux Chromium runtime 缓存
        if: steps.cache-linux-playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: dist/dh-xianyu-agentpanel-linux-${{ matrix.arch }}/playwright-runtime
          key: ${{ steps.cache-linux-playwright.outputs.cache-primary-key }}

      - name: 组装 Linux 安装目录
        run: |
          set -Eeuo pipefail
          package_dir="dist/dh-xianyu-agentpanel-linux-${{ matrix.arch }}"
          cp icon/linux/icon.png "$package_dir/icon.png"
          cp packaging/linux/install.sh packaging/linux/uninstall.sh packaging/linux/dh-xianyu-agentpanel.service scripts/migrate-product-data.sh "$package_dir/"
          chmod +x "$package_dir/install.sh" "$package_dir/uninstall.sh" "$package_dir/migrate-product-data.sh"
          tar -C dist -czf "dist/dh-xianyu-agentpanel-linux-${{ matrix.arch }}-${APP_VERSION}.tar.gz" "$(basename "$package_dir")"

      - name: 上传 Linux 安装包
        if: inputs.app_version != ''
        uses: actions/upload-artifact@v7
        with:
          name: dh-xianyu-agentpanel-linux-${{ matrix.arch }}-${{ env.APP_VERSION }}
          path: dist/dh-xianyu-agentpanel-linux-${{ matrix.arch }}-${{ env.APP_VERSION }}.tar.gz
          if-no-files-found: error

  windows:
    name: Windows 安装包
    needs: prepare
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
      BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
      WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
      WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
      WINDOWS_SIGNING_IDENTITY: ${{ secrets.WINDOWS_SIGNING_IDENTITY }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建嵌入式前端
        shell: pwsh
        run: npm ci --prefix frontend; npm run build --prefix frontend

      - name: 构建 Windows Harness runtime
        shell: pwsh
        working-directory: brain/vendor/deepseek-harness
        run: |
          corepack enable
          $nodeHome = Split-Path -Parent (Get-Command node.exe -ErrorAction Stop).Source
          $pnpmEntrypoint = Join-Path $nodeHome 'node_modules\corepack\dist\pnpm.js'
          if (-not (Test-Path -LiteralPath $pnpmEntrypoint -PathType Leaf)) {
            throw "Corepack pnpm JavaScript 入口不存在: $pnpmEntrypoint"
          }
          $env:npm_execpath = $pnpmEntrypoint
          corepack pnpm install --frozen-lockfile
          $env:CI = 'true'
          corepack pnpm run build
          corepack pnpm exec tsx scripts/build-exe-for-python-sdk.ts --targets=node24-win-x64 --skip-build

      - name: 组装并检查 Windows Brain runtime
        shell: pwsh
        run: |
          $nodeBinary = (node -p "process.execPath")
          node scripts/build-brain-runtime.mjs --output dist/windows/brain --platform windows --arch amd64 --mode native --node-binary $nodeBinary
          node scripts/check-brain-runtime-package.mjs --root dist/windows/brain --probe

      - name: 验证 Windows 托盘逻辑与安装脚本
        shell: pwsh
        run: |
          go test ./cmd/tray
          node --check packaging/windows/migrate-data.fixture.cjs
          $powerShellScripts = @(
            'packaging/windows/service-control.ps1',
            'packaging/windows/migrate-data.ps1',
            'packaging/windows/migrate-data.test.ps1'
          )
          foreach ($powerShellScript in $powerShellScripts) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $powerShellScript).Path,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "Windows 安装脚本在 PowerShell 7 下语法检查失败: $powerShellScript"
            }
          }

          $serviceScript = (Resolve-Path 'packaging/windows/service-control.ps1').Path
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File $serviceScript -Mode stop -ServiceName "DhSyntaxCheck-$PID"
          if ($LASTEXITCODE -ne 0) {
            throw "Windows 服务安装脚本在 Windows PowerShell 5.1 下检查失败，错误码: $LASTEXITCODE"
          }

      - name: 编译 Windows 桌面程序
        shell: pwsh
        run: |
          & packaging/windows/build-resources.ps1
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          $versionLdflags = "-s -w -X github.com/DH-devmax/xyu/internal/version.Version=$env:BUILD_VERSION -X github.com/DH-devmax/xyu/internal/version.Commit=$env:GITHUB_SHA -X github.com/DH-devmax/xyu/internal/version.BuildTime=$env:BUILD_TIME"
          go build -trimpath -ldflags $versionLdflags -o dist/windows/xianyu-server.exe ./cmd/server
          go build -trimpath -ldflags "-s -w" -o dist/windows/browser-install.exe ./cmd/browser-install
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/windows/xianyu-tray.exe ./cmd/tray

      - name: 验证 Windows 品牌数据迁移与回滚
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File (Resolve-Path 'packaging/windows/migrate-data.test.ps1') `
            -Validator (Resolve-Path 'dist/windows/xianyu-server.exe')
          if ($LASTEXITCODE -ne 0) {
            throw "Windows 数据迁移与回滚验证失败，错误码: $LASTEXITCODE"
          }

      - name: 恢复 Windows Chromium runtime 缓存
        id: cache-windows-playwright
        uses: actions/cache/restore@v5
        with:
          path: dist/windows/playwright-runtime/amd64
          key: dh-xianyu-agentpanel-playwright-runtime-v6-windows-amd64-${{ hashFiles('go.mod', 'go.sum', 'cmd/browser-install/**') }}

      - name: 预下载 Windows Chromium runtime
        if: steps.cache-windows-playwright.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows/playwright-runtime/amd64/playwright-driver | Out-Null
          New-Item -ItemType Directory -Force -Path dist/windows/playwright-runtime/amd64/playwright-browsers | Out-Null
          & dist/windows/browser-install.exe `
            -driver-dir "$PWD/dist/windows/playwright-runtime/amd64/playwright-driver" `
            -browser-dir "$PWD/dist/windows/playwright-runtime/amd64/playwright-browsers"
          if ($LASTEXITCODE -ne 0) { throw 'Windows Playwright runtime 下载失败' }

      - name: 校验 Windows Chromium runtime
        shell: pwsh
        run: |
          $runtimeRoot = Resolve-Path 'dist/windows/playwright-runtime/amd64'
          $driverNode = Join-Path $runtimeRoot 'playwright-driver/node.exe'
          $driverCli = Join-Path $runtimeRoot 'playwright-driver/package/cli.js'
          if (-not (Test-Path -LiteralPath $driverNode -PathType Leaf)) { throw 'Windows Playwright driver 缺少 node.exe' }
          if (-not (Test-Path -LiteralPath $driverCli -PathType Leaf)) { throw 'Windows Playwright driver 缺少 package/cli.js' }
          $browserSpec = Get-Content -Raw -LiteralPath (Join-Path $runtimeRoot 'playwright-driver/package/browsers.json') | ConvertFrom-Json
          $chromiumRevision = ($browserSpec.browsers | Where-Object name -eq 'chromium').revision
          $headlessRevision = ($browserSpec.browsers | Where-Object name -eq 'chromium-headless-shell').revision
          if (-not (Test-Path -LiteralPath (Join-Path $runtimeRoot "playwright-browsers/chromium-$chromiumRevision") -PathType Container)) { throw 'Windows Chromium revision 与 driver 不匹配' }
          if (-not (Test-Path -LiteralPath (Join-Path $runtimeRoot "playwright-browsers/chromium_headless_shell-$headlessRevision") -PathType Container)) { throw 'Windows headless shell revision 与 driver 不匹配' }
          $chromium = Get-ChildItem -LiteralPath (Join-Path $runtimeRoot 'playwright-browsers') -Recurse -File |
            Where-Object { $_.Name -in @('chrome.exe', 'headless_shell.exe', 'chrome-headless-shell.exe') } |
            Select-Object -First 1
          if ($null -eq $chromium) { throw 'Windows Chromium runtime 缺少 Chromium 可执行文件' }

      - name: 实际验证 Windows 服务注册
        shell: pwsh
        run: |
          $serviceName = 'DhXianyuAgentPanel'
          $workDir = Join-Path $env:RUNNER_TEMP $serviceName
          $runtimeRoot = (Resolve-Path 'dist/windows/playwright-runtime/amd64').Path
          $productRoot = (Resolve-Path 'dist/windows').Path
          $brainRuntimeRoot = (Resolve-Path 'dist/windows/brain/runtime').Path
          $serviceScript = (Resolve-Path 'packaging/windows/service-control.ps1').Path
          $serverPath = (Resolve-Path 'dist/windows/xianyu-server.exe').Path
          try {
            foreach ($registerAttempt in 1..2) {
              & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
                -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
                -File $serviceScript -Mode register -ServiceName $serviceName `
                -ExePath $serverPath -WorkDir $workDir -RuntimeRoot $runtimeRoot -ProductRoot $productRoot -BrainRuntimeRoot $brainRuntimeRoot
              if ($LASTEXITCODE -ne 0) {
                throw "Windows 服务第 $registerAttempt 次注册失败，错误码: $LASTEXITCODE"
              }
            }
            & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
              -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
              -File $serviceScript -Mode start -ServiceName $serviceName
            if ($LASTEXITCODE -ne 0) { throw "Windows 服务启动失败，错误码: $LASTEXITCODE" }

            $service = Get-Service -Name $serviceName -ErrorAction Stop
            $serviceStatus = $service.Status
            $service.Dispose()
            if ($serviceStatus -ne [System.ServiceProcess.ServiceControllerStatus]::Running) {
              throw "Windows 服务未进入运行状态: $serviceStatus"
            }

            $serviceConfig = Get-CimInstance -ClassName Win32_Service -Filter "Name='$serviceName'" -ErrorAction Stop
            if ($null -eq $serviceConfig) { throw 'Windows 服务注册后无法读取配置' }
            # Win32_Service.PathName 可能会省略不含空格路径两侧的引号，比较前统一去掉引号。
            $actualServiceCommand = $serviceConfig.PathName.Replace('"', '')
            $requiredServiceArguments = @(
              $serverPath,
              '-service',
              "-workdir $workDir",
              "-product-root $productRoot",
              "-brain-runtime-root $brainRuntimeRoot",
              "-brain-data-root $workDir\data\brain",
              "-playwright-runtime-root $runtimeRoot"
            )
            $invalidServiceArgument = $requiredServiceArguments |
              Where-Object {
                $actualServiceCommand.IndexOf($_, [StringComparison]::OrdinalIgnoreCase) -lt 0
              } |
              Select-Object -First 1
            if ($null -ne $invalidServiceArgument) {
              throw "Windows 服务命令行不正确: $($serviceConfig.PathName)"
            }
            $delayedStart = Get-ItemPropertyValue `
              -LiteralPath "Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\$serviceName" `
              -Name DelayedAutostart -ErrorAction Stop
            if ($delayedStart -ne 1) { throw "Windows 服务未配置延迟自动启动: $delayedStart" }
            $sddl = (& "$env:SystemRoot\System32\sc.exe" sdshow $serviceName 2>&1) -join ''
            if ($LASTEXITCODE -ne 0 -or -not $sddl.Contains('(A;;LCRPWP;;;IU)')) {
              throw "Windows 服务未授予交互用户启停权限: $sddl"
            }

            $health = $null
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            while ([DateTime]::UtcNow -lt $deadline -and $null -eq $health) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:59188/health' -TimeoutSec 2
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if ($null -eq $health -or $health.status -ne 'ok' -or $health.database -ne 'ok') {
              throw "Windows 服务健康检查失败: $($health | ConvertTo-Json -Compress)"
            }
          } catch {
            $serverLog = Join-Path $workDir 'logs\server.log'
            if (Test-Path -LiteralPath $serverLog) {
              Get-Content -LiteralPath $serverLog -Tail 200
            }
            throw
          } finally {
            & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
              -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
              -File $serviceScript -Mode uninstall -ServiceName $serviceName
            if ($LASTEXITCODE -ne 0) { throw "Windows 服务清理失败，错误码: $LASTEXITCODE" }
            if ($null -ne (Get-Service -Name $serviceName -ErrorAction SilentlyContinue)) {
              throw 'Windows 服务卸载后仍然存在'
            }
          }

      - name: 保存 Windows Chromium runtime 缓存
        if: steps.cache-windows-playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: dist/windows/playwright-runtime/amd64
          key: ${{ steps.cache-windows-playwright.outputs.cache-primary-key }}

      - name: 校验 Windows 正式发布签名配置
        if: inputs.app_version != '' && (env.WINDOWS_SIGNING_PFX_BASE64 == '' || env.WINDOWS_SIGNING_PFX_PASSWORD == '' || env.WINDOWS_SIGNING_IDENTITY == '')
        shell: pwsh
        run: throw '正式发布必须配置完整的 Windows PFX、密码和签名标识'

      - name: 导入 Windows 签名证书
        if: env.WINDOWS_SIGNING_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'dh-xianyu-agentpanel-windows-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          if (-not (Test-Path -LiteralPath $pfxPath -PathType Leaf)) { throw 'Windows PFX 文件写入失败' }
          "WINDOWS_SIGNING_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 签名 Windows 桌面程序
        if: env.WINDOWS_SIGNING_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $signingFiles = @('dist/windows/xianyu-server.exe','dist/windows/xianyu-tray.exe')
          $signingFiles += @(Get-ChildItem -LiteralPath 'dist/windows/brain/runtime' -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll', '.node' } |
            Select-Object -ExpandProperty FullName)
          & packaging/windows/sign.ps1 `
            -PfxPath $env:WINDOWS_SIGNING_PFX_PATH `
            -Files $signingFiles

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: 构建 Windows 安装器
        shell: pwsh
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          $shortDrive = 'R:'
          if (Test-Path -LiteralPath "$shortDrive\") {
            throw "短路径盘符已被占用: $shortDrive"
          }
          & "$env:SystemRoot\System32\subst.exe" $shortDrive $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath "$shortDrive\")) {
            throw "无法创建 Windows 安装器短路径盘符: $shortDrive"
          }
          $locationPushed = $false
          try {
            Push-Location "$shortDrive\"
            $locationPushed = $true
            $requiredSources = @(
              'dist/windows/xianyu-server.exe',
              'dist/windows/xianyu-tray.exe',
              'dist/windows/playwright-runtime/amd64',
              'dist/windows/brain',
              'icon/windows/icon.ico',
              'packaging/windows/languages/ChineseSimplified.isl',
              'packaging/windows/languages/ChineseTraditional.isl',
              'packaging/windows/service-control.ps1',
              'packaging/windows/migrate-data.ps1'
            )
            foreach ($source in $requiredSources) {
              if (-not (Test-Path -LiteralPath $source)) {
                throw "Windows 安装器源文件或目录不存在: $source"
              }
            }
            $runtimeFiles = Get-ChildItem -LiteralPath 'dist/windows/playwright-runtime/amd64' -Recurse -File
            if ($null -eq ($runtimeFiles | Select-Object -First 1)) {
              throw 'Windows 安装器 Playwright runtime 为空'
            }
            $brainManifest = 'dist/windows/brain/runtime/runtime.json'
            if (-not (Test-Path -LiteralPath $brainManifest -PathType Leaf)) { throw 'Windows 安装器缺少 Brain runtime manifest' }
            $longestRuntimeFile = $runtimeFiles |
              Sort-Object { $_.FullName.Length } -Descending |
              Select-Object -First 1
            Write-Host "Windows runtime 最长源路径长度: $($longestRuntimeFile.FullName.Length)"
            Write-Host "Windows runtime 最长源路径: $($longestRuntimeFile.FullName)"

            $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
            $scriptPath = (Resolve-Path 'packaging/windows/installer.iss').Path
            $outputDir = (Resolve-Path 'dist/windows').Path
            & $compiler /Qp "/O$outputDir" $scriptPath
            if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup 编译失败，错误码: $LASTEXITCODE"
            }
            $installer = Get-ChildItem -Path dist/windows -Filter 'DH-Xianyu-AgentPanel-Setup.exe' -Recurse | Select-Object -First 1
            if ($null -eq $installer) { throw 'Inno Setup 未生成安装器' }
            $target = Join-Path (Resolve-Path dist/windows) 'DH-Xianyu-AgentPanel-Setup.exe'
            if ($installer.FullName -ne $target) { Copy-Item $installer.FullName $target -Force }
          } finally {
            if ($locationPushed) {
              Pop-Location
            }
            & "$env:SystemRoot\System32\subst.exe" $shortDrive /D | Out-Null
          }

      - name: 签名 Windows 安装器
        if: env.WINDOWS_SIGNING_PFX_BASE64 != ''
        shell: pwsh
        run: |
          & packaging/windows/sign.ps1 `
            -PfxPath $env:WINDOWS_SIGNING_PFX_PATH `
            -Files 'dist/windows/DH-Xianyu-AgentPanel-Setup.exe'

      - name: 使用安装器验证服务安装与卸载
        shell: pwsh
        run: |
          $serviceName = 'DhXianyuAgentPanel'
          $installer = (Resolve-Path 'dist/windows/DH-Xianyu-AgentPanel-Setup.exe').Path
          $installLog = Join-Path $env:RUNNER_TEMP 'dh-xianyu-agentpanel-windows-installer.log'
          $installDir = Join-Path $env:ProgramFiles 'DH Xianyu AgentPanel'
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $legacyData = Join-Path $env:ProgramData 'YdisksXianyuHelper'
          $currentData = Join-Path $env:ProgramData 'DhXianyuAgentPanel'
          $migrationEvidence = Join-Path $env:ProgramData 'DhXianyuAgentPanel-migration'
          $migrationLog = Join-Path $migrationEvidence 'installer-migration.log'
          $fixtureServer = (Resolve-Path 'dist/windows/xianyu-server.exe').Path
          try {
            foreach ($fixturePath in @($legacyData, $currentData, $migrationEvidence)) {
              if (Test-Path -LiteralPath $fixturePath) {
                Get-ChildItem -LiteralPath $fixturePath -File -Recurse -Force -ErrorAction SilentlyContinue |
                  ForEach-Object { $_.IsReadOnly = $false }
                Remove-Item -LiteralPath $fixturePath -Recurse -Force
              }
            }
            New-Item -ItemType Directory -Force -Path (Join-Path $legacyData 'data') | Out-Null
            Set-Content -LiteralPath (Join-Path $legacyData 'data-key') -Value 'installer-upgrade-fixture-key' -Encoding ASCII
            & $fixtureServer `
              -verify-data `
              -workdir $legacyData `
              -db (Join-Path $legacyData 'data\xianyu_data.db') `
              -data-key-file (Join-Path $legacyData 'data-key') | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "创建安装器旧版数据样本失败: $LASTEXITCODE" }
            Set-Content -LiteralPath (Join-Path $legacyData 'upgrade-marker.txt') -Value 'legacy' -Encoding ASCII

            $installerProcess = Start-Process -FilePath $installer `
              -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$installLog") `
              -Wait -PassThru
            $installerExitCode = $installerProcess.ExitCode
            if ($installerExitCode -ne 0) {
              if (Test-Path -LiteralPath $installLog) {
                Get-Content -LiteralPath $installLog -Tail 200
              }
              if (Test-Path -LiteralPath $migrationLog) {
                Write-Host '--- migration diagnostic log ---'
                Get-Content -LiteralPath $migrationLog -Tail 200
              }
              throw "Windows 安装器执行失败，错误码: $installerExitCode"
            }

            $service = Get-Service -Name $serviceName -ErrorAction Stop
            $serviceStatus = $service.Status
            $service.Dispose()
            if ($serviceStatus -ne [System.ServiceProcess.ServiceControllerStatus]::Running) {
              throw "安装器未启动 Windows 服务: $serviceStatus"
            }

            $expectedServer = Join-Path $installDir 'xianyu-server.exe'
            $expectedRuntime = Join-Path $installDir 'playwright-runtime'
            $expectedProductRoot = $installDir
            $expectedBrainRuntime = Join-Path $installDir 'brain\runtime'
            $serviceConfig = Get-CimInstance -ClassName Win32_Service -Filter "Name='$serviceName'" -ErrorAction Stop
            $actualServiceCommand = if ($null -eq $serviceConfig) { '' } else { $serviceConfig.PathName.Replace('"', '') }
            $requiredServiceArguments = @(
              $expectedServer,
              '-service',
              "-product-root $expectedProductRoot",
              "-brain-runtime-root $expectedBrainRuntime",
              "-brain-data-root $(Join-Path $env:ProgramData 'DhXianyuAgentPanel\data\brain')",
              "-playwright-runtime-root $expectedRuntime"
            )
            $invalidServiceArgument = $requiredServiceArguments |
              Where-Object {
                $actualServiceCommand.IndexOf($_, [StringComparison]::OrdinalIgnoreCase) -lt 0
              } |
              Select-Object -First 1
            if ($null -ne $invalidServiceArgument) {
              throw "安装器注册的服务命令行不正确: $($serviceConfig.PathName)"
            }

            $health = $null
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            while ([DateTime]::UtcNow -lt $deadline -and $null -eq $health) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:59188/health' -TimeoutSec 2
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if ($null -eq $health -or $health.status -ne 'ok' -or $health.database -ne 'ok') {
              throw "安装器服务健康检查失败: $($health | ConvertTo-Json -Compress)"
            }
            $currentMarker = Join-Path $currentData 'upgrade-marker.txt'
            $legacyMarker = Join-Path $legacyData 'upgrade-marker.txt'
            $migrationRecord = Join-Path $migrationEvidence 'migration.env'
            if ((Get-Content -Raw -LiteralPath $currentMarker).Trim() -ne 'legacy') {
              throw 'Windows 安装器没有迁移旧版数据标记'
            }
            if (-not (Get-Item -LiteralPath $legacyMarker).IsReadOnly) {
              throw 'Windows 安装器没有把旧版副本设为只读'
            }
            if ((Get-Content -Raw -LiteralPath $migrationRecord) -notmatch '(?m)^database_decryption=ok\r?$') {
              throw 'Windows 安装器迁移记录缺少数据库解密成功状态'
            }
            if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
              throw "Windows 卸载器不存在: $uninstaller"
            }
            $expectedTray = Join-Path $installDir 'xianyu-tray.exe'
            & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
              -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
              -File (Resolve-Path 'packaging/windows/service-control.ps1') `
              -Mode stop -TrayPath $expectedTray
            if ($LASTEXITCODE -ne 0) { throw "回滚前停止 Windows 服务失败: $LASTEXITCODE" }
            Set-Content -LiteralPath $currentMarker -Value 'changed-after-upgrade' -Encoding ASCII
            & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
              -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
              -File (Join-Path $migrationEvidence 'rollback-data.ps1')
            if ($LASTEXITCODE -ne 0) { throw "Windows 安装数据回滚失败: $LASTEXITCODE" }
            if ((Get-Content -Raw -LiteralPath $currentMarker).Trim() -ne 'legacy') {
              throw 'Windows 安装数据回滚没有恢复旧版内容'
            }
            & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
              -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
              -File (Resolve-Path 'packaging/windows/service-control.ps1') -Mode start
            if ($LASTEXITCODE -ne 0) { throw "回滚后重启 Windows 服务失败: $LASTEXITCODE" }
            $health = $null
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            while ([DateTime]::UtcNow -lt $deadline -and $null -eq $health) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:59188/health' -TimeoutSec 2
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if ($null -eq $health -or $health.status -ne 'ok' -or $health.database -ne 'ok') {
              throw "Windows 回滚后服务健康检查失败: $($health | ConvertTo-Json -Compress)"
            }
            $startMenuRoots = @(
              (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs'),
              (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs')
            )
            $startMenuShortcut = $startMenuRoots |
              Where-Object { Test-Path -LiteralPath $_ -PathType Container } |
              ForEach-Object {
                Get-ChildItem -LiteralPath $_ -Filter '*.lnk' -Recurse -File -ErrorAction SilentlyContinue
              } |
              Where-Object {
                $shortcutShell = New-Object -ComObject WScript.Shell
                $shortcutTarget = $shortcutShell.CreateShortcut($_.FullName).TargetPath
                [StringComparer]::OrdinalIgnoreCase.Equals($shortcutTarget, $expectedTray)
              } |
              Select-Object -First 1
            if ($null -eq $startMenuShortcut) {
              throw '安装器未创建开始菜单快捷方式'
            }
          } catch {
            if (Test-Path -LiteralPath $installLog) {
              Get-Content -LiteralPath $installLog -Tail 200
            }
            $serverLog = Join-Path $env:ProgramData 'DhXianyuAgentPanel\logs\server.log'
            if (Test-Path -LiteralPath $serverLog) {
              Get-Content -LiteralPath $serverLog -Tail 200
            }
            throw
          } finally {
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              $uninstallerProcess = Start-Process -FilePath $uninstaller `
                -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') `
                -Wait -PassThru
              if ($uninstallerProcess.ExitCode -ne 0) {
                throw "Windows 卸载器执行失败，错误码: $($uninstallerProcess.ExitCode)"
              }
            } elseif ($null -ne (Get-CimInstance -ClassName Win32_Service -Filter "Name='$serviceName'" -ErrorAction SilentlyContinue)) {
              & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
                -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
                -File (Resolve-Path 'packaging/windows/service-control.ps1') `
                -Mode uninstall -ServiceName $serviceName
              if ($LASTEXITCODE -ne 0) { throw "Windows 服务兜底清理失败，错误码: $LASTEXITCODE" }
            }
            if ($null -ne (Get-CimInstance -ClassName Win32_Service -Filter "Name='$serviceName'" -ErrorAction SilentlyContinue)) {
              throw 'Windows 安装器卸载后服务仍然存在'
            }
            $cleanupPaths = @($legacyData, $currentData, $migrationEvidence)
            $cleanupPaths += @(
              Get-ChildItem -LiteralPath $env:ProgramData -Directory -Filter 'DhXianyuAgentPanel.v2-before-rollback-*' -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName
            )
            foreach ($cleanupPath in $cleanupPaths) {
              if (Test-Path -LiteralPath $cleanupPath) {
                Get-ChildItem -LiteralPath $cleanupPath -File -Recurse -Force -ErrorAction SilentlyContinue |
                  ForEach-Object { $_.IsReadOnly = $false }
                Remove-Item -LiteralPath $cleanupPath -Recurse -Force
              }
            }
          }

      - name: 准备唯一 Windows 构建产物
        shell: pwsh
        run: |
          $artifactDir = 'dist/windows-artifact'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item -LiteralPath 'dist/windows/DH-Xianyu-AgentPanel-Setup.exe' -Destination $artifactDir
          $artifactFiles = @(Get-ChildItem -LiteralPath $artifactDir -Recurse -File)
          if ($artifactFiles.Count -ne 1 -or $artifactFiles[0].Name -ne 'DH-Xianyu-AgentPanel-Setup.exe') {
            throw "Windows 构建产物必须且只能包含安装器: $($artifactFiles.FullName -join ', ')"
          }

      - name: 上传 Windows 安装包
        if: inputs.app_version != ''
        uses: actions/upload-artifact@v7
        with:
          name: dh-xianyu-agentpanel-windows-${{ env.APP_VERSION }}
          path: dist/windows-artifact/DH-Xianyu-AgentPanel-Setup.exe
          if-no-files-found: error

  macos:
    name: macOS 安装包 (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
      BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
      MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
      MACOS_INSTALLER_SIGNING_P12_BASE64: ${{ secrets.MACOS_INSTALLER_SIGNING_P12_BASE64 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            playwright_platform: mac14-arm64
            harness_target: node24-macos-arm64
            runtime_mode: native
          - arch: amd64
            runner: macos-15-intel
            playwright_platform: mac15
            harness_target: ''
            runtime_mode: node
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建嵌入式前端
        run: npm ci --prefix frontend && npm run build --prefix frontend

      - name: 构建 macOS Harness runtime
        env:
          HARNESS_TARGET: ${{ matrix.harness_target }}
        working-directory: brain/vendor/deepseek-harness
        run: |
          set -Eeuo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile
          CI=true corepack pnpm run build
          if [ -n "$HARNESS_TARGET" ]; then
            CI=true corepack pnpm exec tsx scripts/build-exe-for-python-sdk.ts --targets="$HARNESS_TARGET" --skip-build
          else
            closure="$PWD/python/sdk-runtime/src/deepseek_harness_runtime/runtime/node"
            corepack pnpm --filter dsh-python-runtime-closure deploy --legacy --prod \
              --config.node-linker=hoisted \
              --config.auto-install-peers=false \
              --config.link-workspace-packages=true \
              "$closure"
            node "$GITHUB_WORKSPACE/scripts/normalize-harness-runtime-closure.mjs" \
              --root "$closure" \
              --source-node-modules "$PWD/python/sdk-runtime/node_modules"
          fi

      - name: 组装并检查 macOS Brain runtime
        env:
          PRODUCT_ARCH: ${{ matrix.arch }}
          RUNTIME_MODE: ${{ matrix.runtime_mode }}
        run: |
          set -Eeuo pipefail
          node_binary="$(node -p 'process.execPath')"
          node scripts/build-brain-runtime.mjs \
            --output "dist/macos/brain/$PRODUCT_ARCH" \
            --platform darwin \
            --arch "$PRODUCT_ARCH" \
            --mode "$RUNTIME_MODE" \
            --node-binary "$node_binary"
          node scripts/check-brain-runtime-package.mjs --root "dist/macos/brain/$PRODUCT_ARCH" --probe

          if [ "$PRODUCT_ARCH" = amd64 ]; then
            empty_path="$RUNNER_TEMP/empty-system-path"
            empty_home="$RUNNER_TEMP/empty-home"
            mkdir -p "$empty_path" "$empty_home"
            carrier="$PWD/dist/macos/brain/amd64/runtime/node-carrier"
            dsh_entry="$PWD/dist/macos/brain/amd64/runtime/node/node_modules/@deepseek-ai/dsh/lib/bin.js"
            env -i HOME="$empty_home" PATH="$empty_path" "$carrier" --version | grep -Eq '^v24\.'
            env -i HOME="$empty_home" PATH="$empty_path" "$carrier" "$dsh_entry" --version | grep -Fxq '0.1.2-alpha.1'
          fi

      - name: 验证 macOS 托盘逻辑
        run: go test ./cmd/tray

      - name: 编译 macOS 桌面程序
        env:
          PRODUCT_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "dist/macos/$PRODUCT_ARCH"
          version_ldflags="-s -w -X github.com/DH-devmax/xyu/internal/version.Version=$BUILD_VERSION -X github.com/DH-devmax/xyu/internal/version.Commit=$GITHUB_SHA -X github.com/DH-devmax/xyu/internal/version.BuildTime=$BUILD_TIME"
          GOOS=darwin GOARCH="$PRODUCT_ARCH" CGO_ENABLED=1 go build -trimpath -ldflags="$version_ldflags" -o "dist/macos/$PRODUCT_ARCH/xianyu-server" ./cmd/server
          GOOS=darwin GOARCH="$PRODUCT_ARCH" CGO_ENABLED=1 go build -trimpath -ldflags='-s -w' -o "dist/macos/$PRODUCT_ARCH/browser-install" ./cmd/browser-install
          GOOS=darwin GOARCH="$PRODUCT_ARCH" CGO_ENABLED=1 go build -trimpath -ldflags='-s -w' -o "dist/macos/$PRODUCT_ARCH/xianyu-tray" ./cmd/tray

      - name: 验证 macOS 品牌数据迁移与回滚
        env:
          PRODUCT_ARCH: ${{ matrix.arch }}
        run: |
          set -Eeuo pipefail
          MIGRATION_VALIDATOR="$PWD/dist/macos/${PRODUCT_ARCH}/xianyu-server" \
            bash scripts/migrate-product-data.test.sh

      - name: 缓存 macOS Chromium runtime
        id: cache-macos-playwright
        uses: actions/cache/restore@v5
        with:
          path: dist/macos/playwright-runtime/${{ matrix.arch }}
          key: dh-xianyu-agentpanel-playwright-runtime-v7-macos-${{ matrix.arch }}-${{ matrix.playwright_platform }}-${{ hashFiles('go.mod', 'go.sum', 'cmd/browser-install/**') }}

      - name: 预下载 macOS Chromium runtime
        if: steps.cache-macos-playwright.outputs.cache-hit != 'true'
        env:
          PRODUCT_ARCH: ${{ matrix.arch }}
          PLAYWRIGHT_PLATFORM: ${{ matrix.playwright_platform }}
        run: |
          set -Eeuo pipefail
          runtime_dir="dist/macos/playwright-runtime/$PRODUCT_ARCH"
          mkdir -p "$runtime_dir/playwright-driver" "$runtime_dir/playwright-browsers"
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE="$PLAYWRIGHT_PLATFORM" \
            "dist/macos/$PRODUCT_ARCH/browser-install" \
            -driver-dir "$PWD/$runtime_dir/playwright-driver" \
            -browser-dir "$PWD/$runtime_dir/playwright-browsers"

      - name: 校验 macOS Chromium runtime
        env:
          PRODUCT_ARCH: ${{ matrix.arch }}
        run: |
          set -Eeuo pipefail
          runtime_dir="dist/macos/playwright-runtime/$PRODUCT_ARCH"
          node_path="$runtime_dir/playwright-driver/node"
          spec_path="$PWD/$runtime_dir/playwright-driver/package/browsers.json"
          test -x "$node_path"
          test -f "$runtime_dir/playwright-driver/package/cli.js"
          test -f "$spec_path"
          chromium_revision="$(RUNTIME_SPEC="$spec_path" node -e 'const b=require(process.env.RUNTIME_SPEC).browsers; console.log(b.find(x=>x.name==="chromium").revision)')"
          headless_revision="$(RUNTIME_SPEC="$spec_path" node -e 'const b=require(process.env.RUNTIME_SPEC).browsers; console.log(b.find(x=>x.name==="chromium-headless-shell").revision)')"
          test -d "$runtime_dir/playwright-browsers/chromium-$chromium_revision"
          test -d "$runtime_dir/playwright-browsers/chromium_headless_shell-$headless_revision"
          chromium_path="$(find "$runtime_dir/playwright-browsers/chromium-$chromium_revision" -type f -path '*/Contents/MacOS/Google Chrome for Testing' -print -quit)"
          headless_path="$(find "$runtime_dir/playwright-browsers/chromium_headless_shell-$headless_revision" -type f -name chrome-headless-shell -print -quit)"
          test -n "$chromium_path"
          test -n "$headless_path"
          node_type="$(file -b "$node_path")"
          chromium_type="$(file -b "$chromium_path")"
          headless_type="$(file -b "$headless_path")"
          case "$PRODUCT_ARCH:$node_type:$chromium_type:$headless_type" in
            arm64:*arm64*:*arm64*:*arm64*) ;;
            amd64:*x86_64*:*x86_64*:*x86_64*) ;;
            *) echo "macOS Playwright runtime 架构错误：$PRODUCT_ARCH / $node_type / $chromium_type / $headless_type" >&2; exit 1 ;;
          esac

      - name: 保存 macOS Chromium runtime 缓存
        if: steps.cache-macos-playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: dist/macos/playwright-runtime/${{ matrix.arch }}
          key: ${{ steps.cache-macos-playwright.outputs.cache-primary-key }}

      - name: 校验 macOS 正式发布签名配置
        if: inputs.app_version != '' && (env.MACOS_SIGNING_P12_BASE64 == '' || env.MACOS_INSTALLER_SIGNING_P12_BASE64 == '' || env.MACOS_SIGNING_P12_PASSWORD == '' || env.MACOS_SIGNING_IDENTITY == '' || env.MACOS_INSTALLER_SIGNING_IDENTITY == '')
        run: |
          echo '正式发布必须配置完整的 macOS 应用与安装器签名证书。' >&2
          exit 1

      - name: 导入 macOS 签名证书
        if: env.MACOS_SIGNING_P12_BASE64 != ''
        run: |
          set -Eeuo pipefail
          keychain_path="$RUNNER_TEMP/dh-xianyu-agentpanel-signing.keychain-db"
          keychain_password="$(uuidgen)"
          app_p12_path="$RUNNER_TEMP/dh-xianyu-agentpanel-signing-app.p12"
          app_cert_path="$RUNNER_TEMP/dh-xianyu-agentpanel-signing-app.pem"
          installer_p12_path="$RUNNER_TEMP/dh-xianyu-agentpanel-signing-installer.p12"
          installer_cert_path="$RUNNER_TEMP/dh-xianyu-agentpanel-signing-installer.pem"
          printf '%s' "$MACOS_SIGNING_P12_BASE64" | base64 --decode > "$app_p12_path"
          printf '%s' "$MACOS_INSTALLER_SIGNING_P12_BASE64" | base64 --decode > "$installer_p12_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          # 临时 CI 钥匙串使用 -A 授权签名工具，避免 set-key-partition-list 触发交互确认。
          security import "$app_p12_path" -k "$keychain_path" -P "$MACOS_SIGNING_P12_PASSWORD" -A
          security import "$installer_p12_path" -k "$keychain_path" -P "$MACOS_SIGNING_P12_PASSWORD" -A
          security find-certificate -c "$MACOS_SIGNING_IDENTITY" -p "$keychain_path" > "$app_cert_path"
          security find-certificate -c "$MACOS_INSTALLER_SIGNING_IDENTITY" -p "$keychain_path" > "$installer_cert_path"
          # GitHub macOS hosted runner 提供免密码 sudo；只修改 admin Trust Settings，避免弹认证对话框。
          # 不传 -k，避免 sudo 以 root 身份把同一张证书重复写入临时钥匙串，破坏私钥匹配。
          sudo -n security add-trusted-cert -d -r trustRoot -p codeSign "$app_cert_path"
          sudo -n security add-trusted-cert -d -r trustRoot -p basic "$installer_cert_path"
          security list-keychains -d user -s "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          echo "MACOS_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: 构建 macOS 安装包
        env:
          PRODUCT_ARCH: ${{ matrix.arch }}
        run: |
          set -Eeuo pipefail
          chmod +x packaging/macos/build-pkg.sh
          packaging/macos/build-pkg.sh "$APP_VERSION" "$PWD/dist/macos" "$PRODUCT_ARCH"

      - name: 上传 macOS 安装包
        if: inputs.app_version != ''
        uses: actions/upload-artifact@v7
        with:
          name: dh-xianyu-agentpanel-macos-${{ matrix.arch }}-${{ env.APP_VERSION }}
          path: dist/macos/DH-Xianyu-AgentPanel-${{ env.APP_VERSION }}-${{ matrix.arch }}.pkg
          if-no-files-found: error
