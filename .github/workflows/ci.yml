name: main 与 Pull Request 质量门禁

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'api/**'
      - 'brain/**'
      - 'cmd/**'
      - 'frontend/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
      - 'migrations/**'
      - 'Makefile'
      - 'packaging/**'
      - 'product/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      full:
        description: 运行完整质量矩阵
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ci full]') && 'full' || 'light' }}
  cancel-in-progress: true

jobs:
  go:
    name: Go 检查
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.full == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ci full]')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 配置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 检查格式
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "$(gofmt -l .)" ]; then
            echo "发现未格式化的 Go 文件，请先运行 gofmt -w。" >&2
            gofmt -l .
            exit 1
          fi

      - name: 检查中文注释
        run: go run ./tools/commentlint -mode check -root .

      - name: 检查产品、供应链与上游锁定清单
        run: make product-check

      - name: 检查架构依赖
        run: go run ./tools/architecturecheck

      - name: 检查 OpenAPI 路由与规范
        run: go run ./tools/apicheck

      - name: 运行 go vet
        run: go vet ./...

      - name: 运行 golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...

      - name: 运行 Go 测试
        run: go test ./...

      - name: 运行 server 并发 smoke race
        run: make test-server-race

  frontend:
    name: React 前端检查
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.full == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ci full]')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci --prefix frontend

      - name: 检查中文注释
        run: npm run comments:check --prefix frontend

      - name: 检查 TypeScript 类型
        run: npm run typecheck --prefix frontend

      - name: 检查 OpenAPI 生成产物
        run: npm run api:check --prefix frontend

      - name: 运行前端测试
        run: npm test --prefix frontend

      - name: 构建并校验嵌入式前端产物
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build --prefix frontend
          git diff --exit-code -- internal/webui/static

  brain:
    name: Harness 客服大脑检查
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.full == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ci full]')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: 检出完整 subtree 历史
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: 验证锁定、结果插件和工具白名单
        run: |
          node scripts/check-product-manifest.mjs
          make brain-check

      - name: 安装固定 Harness 工作区
        working-directory: brain/vendor/deepseek-harness
        env:
          CI: "1"
        run: corepack pnpm@11.7.0 install --frozen-lockfile

      - name: 验证 SDK 补丁与客服 profile 真实启动
        run: |
          corepack pnpm@11.7.0 --dir brain/vendor/deepseek-harness exec vitest run packages/sdk/client
          make brain-profile-integration

  multidb:
    name: MySQL/PostgreSQL 多数据库回归
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.full == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ci full]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: xianyu
          TZ: UTC
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: xianyu
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-postgres-password
          TZ: UTC
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d xianyu"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TEST_MYSQL_URL: "mysql://root:test-root-password@tcp(127.0.0.1:3306)/xianyu?parseTime=true&loc=UTC"
      TEST_POSTGRES_URL: "postgres://postgres:test-postgres-password@127.0.0.1:5432/xianyu?sslmode=disable&timezone=UTC"
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 执行三方言实测回归
        run: make test-multidb

  summary:
    name: 质量门禁汇总
    if: ${{ always() }}
    needs:
      - go
      - frontend
      - brain
      - multidb
    runs-on: ubuntu-24.04
    steps:
      - name: 汇总门禁结果
        env:
          GO_RESULT: ${{ needs.go.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BRAIN_RESULT: ${{ needs.brain.result }}
          MULTIDB_RESULT: ${{ needs.multidb.result }}
        run: |
          set -Eeuo pipefail
          printf 'Go=%s Frontend=%s Brain=%s MultiDB=%s\n' "$GO_RESULT" "$FRONTEND_RESULT" "$BRAIN_RESULT" "$MULTIDB_RESULT"
          for result in "$GO_RESULT" "$FRONTEND_RESULT" "$BRAIN_RESULT" "$MULTIDB_RESULT"; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then
              echo '质量门禁存在失败或取消的作业。' >&2
              exit 1
            fi
          done
          if [[ "$GO_RESULT" == skipped ]]; then
            echo '本次仅运行轻量汇总；完整矩阵使用 [ci full] 或手动 dispatch full=true。'
          else
            echo '完整质量矩阵通过。'
          fi
